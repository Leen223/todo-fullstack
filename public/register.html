<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account - My To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>Create account</h1>

        <p id="error" class="error" role="alert" hidden></p>

        <form id="auth-form" class="auth-form" data-mode="register" novalidate>
            <label for="name">Name</label>
            <input id="name" type="text" maxlength="100" autocomplete="name">

            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email">

            <label for="password">Password (at least 8 characters)</label>
            <input id="password" type="password" autocomplete="new-password">

            <label for="confirm">Confirm password</label>
            <input id="confirm" type="password" autocomplete="new-password">

            <button type="submit">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>

    <script src="api.js"></script>
    <script src="auth.js"></script>
</body>
</html>
